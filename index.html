</head>
<body>
  <div class="android-shell">
    <header class="topbar">
      <button class="brand" id="brandBtn" aria-label="Inicio">
        <img src="icon-192.png" alt="" class="brand-icon">
        <span><strong>BUEN CAMINO</strong><small>CAMINO FRANCÉS</small></span>
      </button>
      <button class="doubts-btn earth-home-btn" id="doubtsBtn"><b>🌍</b> EARTH</button>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav">
      <button data-nav="home" class="active"><span>⌂</span>Inicio</button>
      <button data-nav="stages"><span>👣</span>Etapas</button>
      <button data-nav="map"><span>🗺</span>Mapa</button>
      <button data-nav="favorites"><span>♡</span>Favoritos</button>
      <button data-nav="mycamino"><span>◎</span>Mi Camino</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="doubtsBackdrop" class="doubts-backdrop" hidden>
    <section class="doubts-sheet" role="dialog" aria-modal="true" aria-labelledby="doubtsTitle">
      <div class="doubts-head"><div><span>AYUDA RÁPIDA</span><h2 id="doubtsTitle">DUDAS · Consejos del peregrino</h2></div><button id="closeDoubts" type="button" aria-label="Cerrar">×</button></div>
      <div id="doubtsBody" class="doubts-body"></div>
    </section>
  </div>
  <div id="focusOverlay" class="focus-overlay" hidden></div>
  <script src="data.js?v=1003"></script>
  <script src="verified-routes.js?v=1003"></script>
  <script src="app.js?v=1005"></script>
  <script>
  /* V10.0: vigilante de arranque. No borra localStorage: conserva Favoritos, Mi Camino, likes y comentarios. */
  setTimeout(function(){
    var host=document.getElementById('app');
    if(!host || host.children.length) return;
    var key='bc-boot-watchdog-v100';
    var already=false; try{already=sessionStorage.getItem(key)==='1'}catch(e){}
    if(already){
      host.innerHTML='<section class="section"><div style="background:#fff;border:1px solid #d5e0ec;border-radius:16px;padding:18px;margin-top:12px"><h2 style="margin-top:0">BUEN CAMINO</h2><p>No se han cargado todos los archivos de la versión 10.0.</p><button id="bcEmergencyReload" style="width:100%;min-height:48px;border:0;border-radius:12px;background:#ffc400;color:#062b65;font-weight:950">↻ RECARGAR APP</button><small style="display:block;margin-top:10px;color:#65758a">Tus datos personales guardados en el dispositivo se conservan.</small></div></section>';
      document.getElementById('bcEmergencyReload').onclick=function(){location.reload()};
      return;
    }
    try{sessionStorage.setItem(key,'1')}catch(e){}
    (async function(){
      try{
        if('serviceWorker' in navigator){var reg=await navigator.serviceWorker.getRegistration('./');if(reg)await reg.unregister().catch(function(){return false})}
        if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return k.indexOf('buen-camino-')===0}).map(function(k){return caches.delete(k)}))}
      }catch(e){}
      var u=new URL('./',location.href);u.searchParams.set('bcv','100');u.searchParams.set('repair',String(Date.now()));location.replace(u.href);
    })();
  },1600);
  </script>
</body>
</html>
