<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#062b65">
  <meta name="application-name" content="BUEN CAMINO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BUEN CAMINO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="BUEN CAMINO: guía gratuita del Camino Francés con 33 etapas, mapas, GPS, servicios y descargas para Android, iPhone y PWA.">
  <link rel="preconnect" href="https://a.tile.opentopomap.org" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin>
  <link rel="manifest" href="manifest.webmanifest?v=80">
  <link rel="canonical" href="https://inamark60-hue.github.io/camino-frances/">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=80">
  <title>BUEN CAMINO</title>
</head>
<body>
  <div class="android-shell">
    <header class="topbar">
      <button class="brand" id="brandBtn" aria-label="Inicio">
        <img src="icon-192.png" alt="" class="brand-icon">
        <span><strong>BUEN CAMINO</strong><small>CAMINO FRANCÉS</small></span>
      </button>
      <button class="doubts-btn earth-home-btn" id="doubtsBtn"><b>🌍</b> EARTH</button>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav">
      <button data-nav="home" class="active"><span>⌂</span>Inicio</button>
      <button data-nav="stages"><span>👣</span>Etapas</button>
      <button data-nav="map"><span>🗺</span>Mapa</button>
      <button data-nav="favorites"><span>♡</span>Favoritos</button>
      <button data-nav="mycamino"><span>◎</span>Mi Camino</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="doubtsBackdrop" class="doubts-backdrop" hidden>
    <section class="doubts-sheet" role="dialog" aria-modal="true" aria-labelledby="doubtsTitle">
      <div class="doubts-head"><div><span>AYUDA RÁPIDA</span><h2 id="doubtsTitle">DUDAS · Consejos del peregrino</h2></div><button id="closeDoubts" type="button" aria-label="Cerrar">×</button></div>
      <div id="doubtsBody" class="doubts-body"></div>
    </section>
  </div>
  <div id="focusOverlay" class="focus-overlay" hidden></div>
  <script src="data.js?v=80"></script>
  <script src="verified-routes.js?v=80"></script>
  <script src="app.js?v=80"></script>
</body>
</html>
